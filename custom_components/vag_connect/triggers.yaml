# Named triggers exposed by VW Group Connect (experimental, HA 2026.7+).
# Human-readable names + descriptions live in strings.json / translations.
# v4.7.11 (trigger-vin-targeting): each trigger accepts an OPTIONAL `vin` option
# (17 uppercase chars) and/or a `target:` device — set either to fire only for
# that vehicle. Unset, the trigger fires for ANY of the account's vehicles (v1
# behaviour) and the action can still filter on the payload's `vin`.
started_charging:
stopped_charging:
plugged_in:
unplugged:
locked:
unlocked:
started_preconditioning:
stopped_preconditioning:
charge_target_reached:
